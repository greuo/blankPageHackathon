<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f9fc" />
    <meta
      name="description"
      content="A fictional demonstration of clinician-created recovery companions."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Discharge Companion · Care for the days ahead</title>
    <style>
      html,
      body {
        margin: 0;
        background: #f5f9fc;
        color: #20394a;
      }
      .first-paint {
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 28px;
        box-sizing: border-box;
        text-align: center;
        font-family: 'Trebuchet MS', sans-serif;
      }
      .first-symbol {
        width: 112px;
        height: 112px;
        margin-bottom: 24px;
      }
      .first-title {
        font-size: clamp(28px, 4vw, 44px);
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.035em;
        margin: 0;
      }
      .first-description {
        font-size: 17px;
        margin-top: 16px;
        color: #4f6470;
      }
      .first-note {
        position: absolute;
        bottom: 28px;
        font-size: 12px;
        color: #4f6470;
      }
      @media (max-width: 760px) {
        .first-symbol {
          width: 96px;
          height: 96px;
        }
        .first-title {
          max-width: 15ch;
          font-size: 30px;
        }
        .first-description {
          max-width: 24ch;
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="first-paint" aria-label="Opening Discharge Companion">
        <svg class="first-symbol" viewBox="0 0 120 120" aria-hidden="true">
          <path d="M18 102V21a3 3 0 0 1 3-3h81" fill="none" stroke="#3271ab" stroke-width="2" />
          <path d="M102 18v81a3 3 0 0 1-3 3H18" fill="none" stroke="#247454" stroke-width="2" />
          <text
            x="59"
            y="79"
            text-anchor="middle"
            font-family="Trebuchet MS,sans-serif"
            font-size="51"
            letter-spacing="-3"
            fill="#20394a"
          >
            dc
          </text>
        </svg>
        <h1 class="first-title">Discharge Companion</h1>
        <p class="first-description">A little clarity for the days ahead.</p>
        <p class="first-note">A fictional care experience.</p>
      </main>
    </div>
    <noscript>This fictional companion needs JavaScript to open its workspace.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
